<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >
    <div class="form-container">
        <h2>Feedback Form</h2>
        <form id="feedbackForm" action="#" method="post" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" pattern="^\d{10}$" required>
                <small>Enter a valid 10-digit phone number.</small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <label for="response">Your Response</label>
                <textarea id="response" name="response" placeholder="Your Feedback" required></textarea>
            </div>

            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

    <script>
        
        function validateForm() {
            const form = document.getElementById('feedbackForm');
            
          
            if (!form.checkValidity()) {
                alert('Please fill out all fields correctly.');
                return false;
            }
            
           
            form.reset();
            return false;  
        }
    </script>
</body>
</html>
